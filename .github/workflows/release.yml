name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex.: v2.1.0)"
        required: true

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Ludoteca.sln -c Release

      - name: Read version
        shell: pwsh
        run: |
          $appVersion = "${{ env.RELEASE_TAG }}".TrimStart("v")
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV

      - name: Publish
        run: >-
          dotnet publish Ludoteca/Ludoteca.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.APP_VERSION }}
          -p:DebugType=None
          -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous release
        continue-on-error: true
        run: >-
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          -o Releases

      # The package id must differ from the data folder (%LOCALAPPDATA%\JOGOTECA):
      # uninstalling removes %LOCALAPPDATA%\<packId>.
      - name: Pack
        run: >-
          vpk pack
          --packId JOGOTECA-App
          --packVersion ${{ env.APP_VERSION }}
          --packDir publish
          -r win-x64
          --mainExe JOGOTECA.exe
          --packTitle JOGOTECA
          --packAuthors "Nicolas Murtha"
          --icon Ludoteca/Assets/Ludoteca.ico
          -o Releases

      - name: Upload release
        run: >-
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "JOGOTECA v${{ env.APP_VERSION }}"
          --tag v${{ env.APP_VERSION }}
          --targetCommitish ${{ github.sha }}
          -o Releases
