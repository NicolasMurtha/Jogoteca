name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex.: v2.1.0)"
        required: true

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Ludoteca.sln -c Release

      - name: Read version
        shell: pwsh
        run: |
          $appVersion = "${{ env.RELEASE_TAG }}".TrimStart("v")
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV

      - name: Release notes
        shell: bash
        run: |
          tag="v${APP_VERSION}"
          previous=$(git describe --tags --abbrev=0 --exclude "$tag" HEAD 2>/dev/null || true)
          range=${previous:+$previous..}HEAD
          {
            echo "## O que mudou"
            echo
            git log "$range" --no-merges --format='### %s%n%n%b' -- . ':!.github'
            if [ -n "$previous" ]; then
              echo
              echo "**Todas as mudanças:** https://github.com/${{ github.repository }}/compare/$previous...$tag"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        run: >-
          dotnet publish Ludoteca/Ludoteca.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.APP_VERSION }}
          -p:DebugType=None
          -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous release
        continue-on-error: true
        run: >-
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          -o Releases

      # The package id must differ from the data folder (%LOCALAPPDATA%\JOGOTECA):
      # uninstalling removes %LOCALAPPDATA%\<packId>.
      - name: Pack
        run: >-
          vpk pack
          --packId JOGOTECA-App
          --packVersion ${{ env.APP_VERSION }}
          --packDir publish
          -r win-x64
          --mainExe JOGOTECA.exe
          --packTitle JOGOTECA
          --packAuthors "Nicolas Murtha"
          --icon Ludoteca/Assets/Ludoteca.ico
          --releaseNotes release-notes.md
          -o Releases

      - name: Upload release
        run: >-
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "JOGOTECA v${{ env.APP_VERSION }}"
          --tag v${{ env.APP_VERSION }}
          --targetCommitish ${{ github.sha }}
          -o Releases

      - name: Release page notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ env.APP_VERSION }}" --notes-file release-notes.md
