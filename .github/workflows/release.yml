name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex.: v2.0.0)"
        required: true

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Ludoteca.sln -c Release

      - name: Publish JOGOTECA.exe
        run: >-
          dotnet publish Ludoteca/Ludoteca.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -p:DebugType=None
          -o dist/JOGOTECA-win-x64

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/JOGOTECA-win-x64/JOGOTECA.exe -DestinationPath "JOGOTECA-${{ env.VERSION }}-win-x64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: JOGOTECA ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/JOGOTECA-win-x64/JOGOTECA.exe
            JOGOTECA-${{ env.VERSION }}-win-x64.zip
