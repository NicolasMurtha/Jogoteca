name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Ludoteca.sln -c Release

      - name: Publish JOGOTECA.exe
        run: >-
          dotnet publish Ludoteca/Ludoteca.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -p:DebugType=None
          -o dist/JOGOTECA-win-x64

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/JOGOTECA-win-x64/JOGOTECA.exe -DestinationPath "JOGOTECA-${{ github.ref_name }}-win-x64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          name: JOGOTECA ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/JOGOTECA-win-x64/JOGOTECA.exe
            JOGOTECA-${{ github.ref_name }}-win-x64.zip
